[project]
name = "ai-engineering-os"
version = "0.1.0"
description = "Observable AI-native engineering workflow for software teams and solo engineers."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128",
  "uvicorn[standard]>=0.35",
  "typer>=0.16",
  "rich>=14",
  "sqlalchemy>=2.0",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
]

[project.scripts]
aeo = "aeo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
